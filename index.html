<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1410" />
    <title>PotholePing — Detect</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1 class="brand">Pothole<span>Ping</span></h1>
        <nav class="nav">
          <a href="/index.html" class="active">Detect</a>
          <a href="/map.html">Map</a>
        </nav>
      </header>

      <div class="stage" aria-label="Live camera detection">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn" type="button" disabled>Start Detecting</button>
        <button id="stopBtn" class="secondary" type="button" disabled>Stop</button>
        <label class="model-picker">
          Model
          <select id="modelSelect" aria-label="ONNX model version"></select>
        </label>
        <button id="debugToggle" class="secondary compact" type="button" title="Raw low-confidence candidates only — does not change logging">Debug</button>
      </div>

      <div class="meta">
        <p id="status">Initializing…</p>
        <p class="stat">Logged: <strong id="logCount">0</strong></p>
        <p id="pendingCount" class="pending-pill" hidden></p>
      </div>

      <aside id="debugHud" class="debug-hud" hidden></aside>
    </div>

    <div
      id="sessionSummary"
      class="summary-overlay"
      hidden
      aria-hidden="true"
      role="dialog"
      aria-labelledby="summaryTitle"
    >
      <div class="summary-card">
        <h2 id="summaryTitle">Drive summary</h2>
        <div id="summaryBody"></div>
        <div class="summary-actions">
          <button id="summaryCsvBtn" class="secondary" type="button" disabled>CSV</button>
          <button id="summaryGeoBtn" class="secondary" type="button" disabled>GeoJSON</button>
          <button id="summaryMapBtn" type="button">View map</button>
          <button id="summaryCloseBtn" class="secondary" type="button">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
